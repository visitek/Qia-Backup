[workspace]
members = ["."]
exclude = ["src-tauri"]
resolver = "2"

[package]
name = "qia-backup"
version = "0.2.0"
edition = "2024"
description = "Qia Backup: Time Machine / APFS snapshot backup to AWS S3"
license = "MIT"
autobins = false
default-run = "qia-backupctl"

[lib]
name = "qia_backup"
path = "src/lib.rs"

[[bin]]
name = "qia-backupctl"
path = "src/bin/qia-backupctl.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
lz4_flex = "0.11"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
quick-xml = { version = "0.37", features = ["serialize"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
walkdir = "2"
globset = "0.4"
xattr = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
filetime = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
